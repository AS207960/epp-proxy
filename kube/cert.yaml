apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: epp-proxy-cert
spec:
  secretName: epp-proxy-tls
  duration: 8760h
  renewBefore: 360h
  commonName: epp-proxy
  subject:
    organizations:
      - AS207960
  isCA: false
  privateKey:
    size: 4096
    algorithm: RSA
    encoding: PKCS1
  usages:
    - server auth
  dnsNames:
    - epp-proxy
    - epp-proxy.default
  issuerRef:
    name: epp-ca-issuer
    kind: Issuer
    group: cert-manager.io
---
